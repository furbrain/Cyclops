launch:

- include:
    file: "$(find-pkg-share tactical_frog)/launch/web.yaml"

#- include:
#    file: "$(find-pkg-share tactical_frog)/launch/sensors.yaml"

#- include:
#    file: "$(find-pkg-share tactical_frog)/launch/calibration.yaml"

#- include:
#    file: "$(find-pkg-share tactical_frog)/launch/cleaning.yaml"

- include:
    file: "$(find-pkg-share tactical_frog)/launch/monitor.yaml"

- node:
    pkg: tactical_frog
    exec: switcher
    name: switcher
    output: screen
    param:
      - name: cal_fname
        value: "$(find-pkg-share tactical_frog)/launch/calibration.yaml"
      - name: capture_fname
        value: "$(find-pkg-share tactical_frog)/launch/orb.launch.py"

- node:
    pkg: tactical_frog
    exec: button_monitor
    name: button_monitor
    param:
      - name: pin
        value: 20

- node:
    pkg: tactical_frog
    exec: beeper
    name: beeper
    namespace: "$(var ns)/beeper"

