<h3>Recordings</h3>
<div class="row justify-content-center mb-2">
    <div class="col-sm-6">
    <button class="btn btn-outline-primary" onclick="reloadRecordings()">Refresh</button>
    <button class="btn btn-outline-primary" onclick="openCombineModal()">New combined model…</button>
    </div>
</div>
<div class="row justify-content-center">
    <div class="col-sm-6 " id="recordings_holder">
        {% include "recordings_fragment.html" %}
    </div>
</div>

<!-- Rename Modal -->
<div class="modal fade" id="renameModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Rename File</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="currentFileName">
            <div class="mb-3">
                <label for="newFileName" class="form-label">New name</label>
                <input type="text" id="newFileName" class="form-control">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-primary" onclick="handleRename()">Rename</button>
        </div>
    </div>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Rename File</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
            <div class="mb-3">
                Are you sure you want to delete <label id="deleteFileName"></label>?
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-danger" onclick="handleDelete()">Delete</button>
        </div>
    </div>
  </div>
</div>


<div class="modal fade" id="combineModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">New combined model</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
            <label for="combineName" class="form-label">Name</label>
            <input type="text" id="combineName" class="form-control" placeholder="e.g. whole_cave">
            <div class="form-text">You choose its sub-surveys and how they link up on its model page.</div>
            <div id="combineError" class="text-danger small mt-2"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-primary" onclick="handleCombine()">Create</button>
        </div>
    </div>
  </div>
</div>
