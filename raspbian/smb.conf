# Samba config for TacticalFrog, loaded by raspbian/smbd.service (not /etc/samba/smb.conf).
# smbd re-reads this file by itself within a minute of it changing, so edits need no sudo or restart.
# Check it with:  testparm -s /opt/TacticalFrog/current/raspbian/smb.conf
#
# Shares /data/trips read-only as \\<device>\trips (smb://<device>/trips on macOS/Linux).
# Guests can connect from macOS, phones and Linux command-line tools (smbclient). Windows 10/11 refuse
# guest access by default, and GNOME Files/gio fail on it ("Invalid argument": the client gives up after
# the server's challenge), so on those log in as "frog" (mapped to pi in smbusers) with pi's Samba
# password - set with sudo smbpasswd -a pi, and separate from the Linux one. Leave the domain as
# WORKGROUP, and tick "Remember" so it's only asked once.

[global]
	server role = standalone server
	server string = TacticalFrog
	workgroup = WORKGROUP
	# SMB2+ over port 445 only: no NetBIOS (nmbd) needed. Windows finds the device through wsdd, macOS
	# and Linux through mDNS (registered with avahi by smbd itself)
	server min protocol = SMB2_10
	disable netbios = yes
	smb ports = 445
	multicast dns register = yes
	# unknown users get guest access; with no writable shares, that can only ever read
	map to guest = bad user
	guest account = nobody
	# the "frog" login
	username map = /opt/TacticalFrog/current/raspbian/smbusers
	# no printers
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	logging = file
	log file = /var/log/samba/log.%m
	max log size = 1000

[trips]
	comment = TacticalFrog recordings and models (read only)
	path = /data/trips
	read only = yes
	guest ok = yes
	# read files as pi, whoever connects (OpenMVS writes some as mode 600); read only still applies
	force user = pi
	# combined models link to their sub-surveys (../<survey>), which stay inside the share
	follow symlinks = yes
	wide links = no
